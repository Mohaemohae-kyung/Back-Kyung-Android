name: Release APK

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [main] # main push 시 자동 실행
    tags:
      - "v*" # v0.1.0 같은 태그 push 시 자동 실행

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > Back-Kyung-Android-keystore.jks

      - name: Decode google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json

      - name: Write local.properties
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_HOME
          KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS=${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matchingon-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Compute classes.dex sha256 and versionCode
        id: dexhash
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          HASH=$(unzip -p "$APK" classes.dex | sha256sum | awk '{print $1}')
          VC=$(grep -E 'versionCode\s*=\s*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          PKG=$(grep -E 'applicationId\s*=\s*"' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "vc=$VC"      >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG"    >> "$GITHUB_OUTPUT"
          echo "Computed: pkg=$PKG vc=$VC hash=$HASH"

      - name: Register hash to backend allowlist
        env:
          BACKEND_BASE_URL: ${{ secrets.BACKEND_BASE_URL }}
          BACKEND_ADMIN_EMAIL: ${{ secrets.BACKEND_ADMIN_EMAIL }}
          BACKEND_ADMIN_PASSWORD: ${{ secrets.BACKEND_ADMIN_PASSWORD }}
          HASH: ${{ steps.dexhash.outputs.hash }}
          VC: ${{ steps.dexhash.outputs.vc }}
          PKG: ${{ steps.dexhash.outputs.pkg }}
        run: |
          set -e

          LOGIN_RES=$(curl -fsS -X POST "$BACKEND_BASE_URL/api/auth/login" \
            -H "Content-Type: application/json" \
            -d "{\"email\":\"$BACKEND_ADMIN_EMAIL\",\"password\":\"$BACKEND_ADMIN_PASSWORD\"}")

          TOKEN=$(echo "$LOGIN_RES" | jq -r '.result.accessToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Login failed. Response: $LOGIN_RES" >&2
            exit 1
          fi

          curl -fsS -X POST "$BACKEND_BASE_URL/api/admin/integrity/allowlist" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"packageName\":\"$PKG\",\"versionCode\":$VC,\"buildType\":\"release\",\"sha256\":\"$HASH\",\"note\":\"ci:run-${{ github.run_id }}\"}"

          echo
          echo "Registered: pkg=$PKG vc=$VC buildType=release sha256=$HASH"
